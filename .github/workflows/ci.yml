name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src tests evals

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (core, no native extras — proves fallbacks work)
        run: pip install -e ".[dev]"
      - name: Unit + integration tests
        run: pytest --cov=src/onboarding_agent --cov-report=xml -q
      - name: Tests with tree-sitter + faiss extras
        run: |
          pip install -e ".[treesitter,faiss]"
          pytest -q

  eval-gate:
    # Fails the build when retrieval or answer quality drops below thresholds.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,treesitter]"
      - name: Run benchmark with quality thresholds
        run: python -m evals.run_eval --check
      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval_results/summary.json

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t onboarding-agent:ci .
