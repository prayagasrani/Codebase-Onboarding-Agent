[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "onboarding-agent"
version = "0.1.0"
description = "Codebase Onboarding Agent: codebase RAG + live GitHub data + persistent user memory"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "langgraph>=0.2.60",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "structlog>=24.1",
    "sqlalchemy>=2.0",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
    "networkx>=3.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
faiss = ["faiss-cpu>=1.8"]
treesitter = ["tree-sitter>=0.23", "tree-sitter-language-pack>=0.4"]
embeddings = ["sentence-transformers>=3.0"]
postgres = ["psycopg2-binary>=2.9"]
ui = ["streamlit>=1.37"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
all = [
    "onboarding-agent[faiss,treesitter,embeddings,postgres,ui,dev]",
]

[project.scripts]
onboarding-agent = "onboarding_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/onboarding_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
ignore = ["E501"]
